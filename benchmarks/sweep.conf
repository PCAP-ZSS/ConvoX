# Full benchmark matrix (Table I of the synopsis). Format: key = space-separated values.
# '#' starts a comment. Used by: convox sweep --config benchmarks/sweep.conf

image_dir = data/images
images    = img01_4k img02_4k img03_8k img04_8k
filter    = gaussian
k         = 3 5 7 9 11 13 15
reps      = 10

# OpenMP: thread-count sweep uses static schedule and row parallelism.
omp.threads = 1 2 4 6 8 12 16
# Schedule x collapse sweep runs at this one thread count (a full cross product with the
# thread sweep would multiply the runtime by ~7 without adding a new finding).
omp.sched_threads = 8
omp.schedule = static dynamic:1 dynamic:8 dynamic:32 guided
omp.collapse = 1 2

# CUDA: naive, +constant, +constant+shared tiling, each at every block shape.
cuda.variants = naive const tiled
cuda.block    = 8x8 16x16 32x32
